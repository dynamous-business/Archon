name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  postgres-parity:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      ARCHON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TB_CANARY: ${{ secrets.TB_CANARY }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Secret visible inside the job
        run: 'echo "job sees secret length ${#TB_CANARY}"'

      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
        env:
          ARCHON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres