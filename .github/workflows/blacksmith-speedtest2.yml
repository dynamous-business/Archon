# Temporary: second speed comparison for more Linux jobs from test.yml. Fork only.
name: Blacksmith speed test 2

on:
  push:
    branches: [speedtest2]

env:
  BUN_VERSION: '1.4.2'

jobs:
  cli-tests-1:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Runner facts
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "vcpu=$(nproc)"
          free -h | grep Mem
          grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Validate (Linux)
        env:
          ARCHON_TEST_PART: 1/2
        run: bun run validate --only cli-tests

  package-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Runner facts
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "vcpu=$(nproc)"
          free -h | grep Mem
          grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Validate (Linux)
        env:
          ARCHON_TEST_PART: 1/1
        run: bun run validate --only package-tests

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # A full image rebuild (any change to an early Dockerfile layer) once hit
      # "no space left on device" on runners with ~20GB free, because the provider
      # SDKs' multi-platform vendor binaries land in node_modules. Deleting the big
      # unused toolchains fixes that but costs 45-97s, so it runs only when the
      # runner is short on space; current ubuntu-latest images have far more free.
      - name: Free runner disk space if needed
        run: |
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            df -h /
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only pushes to main and dev write the layer cache; pull requests read it.
      # The repository's Actions cache is capped at 10GB, and when every PR wrote a
      # mode=max copy of the image, PR copies evicted dev's layers ("blob ... not
      # found", then a rebuild) and the export alone took ~3.5 minutes of each run.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: archon-ci:test
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Slack upgrade on persistent volumes, offline
        run: bash scripts/test-docker-slack-upgrade.sh archon-ci:test

      - name: Set up QEMU for arm64 plugin verification
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build arm64 Slack bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          target: image-plugins
          platforms: linux/arm64
          load: true
          tags: archon-ci:slack-arm64
          cache-from: type=gha

      - name: Initialize arm64 Slack bundle offline
        run: |
          docker run --rm --platform linux/arm64 --network none --entrypoint bun archon-ci:slack-arm64 \
            -e 'import { inspectChatPlugin } from "./packages/cli/src/commands/inspect-chat-plugin"; const descriptor = await inspectChatPlugin("/opt/archon/image-plugins/archon-chat-slack"); if (descriptor.id !== "slack") process.exit(1);'

      - name: Smoke test — container starts and serves /api/health
        run: |
          docker run -d --name archon-smoke -e PORT=3000 -e CLAUDE_USE_GLOBAL_AUTH=true -p 3000:3000 archon-ci:test
          sleep 5
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health

      - name: Dump container logs on failure
        if: failure()
        run: docker logs archon-smoke 2>&1 || true

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f archon-smoke || true

